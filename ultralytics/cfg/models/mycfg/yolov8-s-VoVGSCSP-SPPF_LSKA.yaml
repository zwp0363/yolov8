# Ultralytics YOLOv8 🚀, AGPL-3.0 license
# Improved YOLOv8s model with SPPF-LSKA and VoVGSCSP modules
# 专为硕士论文设计：轻量化 s 版本 + 改进特征提取与融合

# Parameters
nc: 16  # number of classes (根据你的数据集自动调整，写16或80都没关系，代码会覆盖)
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]  # YOLOv8s scale (这是关键，确保你是 S 模型)

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 9. 改进点1：使用 SPPF-LSKA 替换原版 SPPF

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, VoVGSCSP, [512]]  # 12. 改进点2：Neck部分使用 VoVGSCSP 替换 C2f

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, VoVGSCSP, [256]]  # 15. 改进点2：Neck部分使用 VoVGSCSP (P3 output)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, VoVGSCSP, [512]]  # 18. 改进点2：Neck部分使用 VoVGSCSP (P4 output)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, VoVGSCSP, [1024]]  # 21. 改进点2：Neck部分使用 VoVGSCSP (P5 output)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)