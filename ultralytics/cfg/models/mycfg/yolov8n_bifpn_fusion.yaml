# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8n 原始配置 + 仅替换 Concat 为 Fusion (mode='bifpn')

# Parameters
nc: 80  # number of classes
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n 原始尺度参数 [depth, width, max_channels]

# Backbone (完全保留 YOLOv8 原始配置，无任何修改)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9 (YOLOv8 原始 SPPF，无修改)

# Neck (完全保留 YOLOv8 原始结构，仅替换 Concat 为 Fusion (mode='bifpn'))
neck:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10 (上采样，原生配置)
  # 修改点 1：替换 Concat 为 Fusion (mode='bifpn')，通道数保持 512（与原生 Concat 输出一致）
  - [[-1, 6], 1, Fusion, [512, 'bifpn']]  # 11 (融合 P5 上采样结果与 P4，替换原生 Concat)
  - [-1, 3, C2f, [512, False]]  # 12 (C2f 特征细化，原生配置)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13 (上采样，原生配置)
  # 修改点 2：替换 Concat 为 Fusion (mode='bifpn')，通道数保持 256（与原生 Concat 输出一致）
  - [[-1, 4], 1, Fusion, [256, 'bifpn']]  # 14 (融合 P4 上采样结果与 P3，替换原生 Concat)
  - [-1, 3, C2f, [256, False]]  # 15 (C2f 特征细化，原生配置) → 最终 P3 输出

  - [-1, 1, Conv, [256, 3, 2]]  # 16 (下采样，原生配置)
  # 修改点 3：替换 Concat 为 Fusion (mode='bifpn')，通道数保持 512（与原生 Concat 输出一致）
  - [[-1, 12], 1, Fusion, [512, 'bifpn']]  # 17 (融合 P3 下采样结果与 P4，替换原生 Concat)
  - [-1, 3, C2f, [512, False]]  # 18 (C2f 特征细化，原生配置) → 最终 P4 输出

  - [-1, 1, Conv, [512, 3, 2]]  # 19 (下采样，原生配置)
  # 修改点 4：替换 Concat 为 Fusion (mode='bifpn')，通道数保持 1024（与原生 Concat 输出一致）
  - [[-1, 9], 1, Fusion, [1024, 'bifpn']]  # 20 (融合 P4 下采样结果与 P5，替换原生 Concat)
  - [-1, 3, C2f, [1024, False]]  # 21 (C2f 特征细化，原生配置) → 最终 P5 输出

# Head (YOLOv8 Detect head)
head:
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)