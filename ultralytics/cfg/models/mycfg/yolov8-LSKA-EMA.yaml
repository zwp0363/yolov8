# Architecture: SPPF_LSKA + EMA (Attention at Neck)

# Parameters
nc: 16
scales:
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 保留你唯一的涨点模块

# Neck
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  # === 改进点：在小目标/中目标层加入 EMA 注意力 ===
  - [-1, 1, EMA, [256]]  # 15 (在 P3 输出后加注意力)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  
  # === 改进点：在中/大目标层加入 EMA 注意力 ===
  - [-1, 1, EMA, [512]]  # 19 (在 P4 输出后加注意力)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  # === 改进点：在大目标层加入 EMA 注意力 ===
  - [-1, 1, EMA, [1024]] # 23 (在 P5 输出后加注意力)

  # 检测头
  - [[15, 19, 23], 1, Detect, [nc]] # 注意：输入层索引变了