# Ultralytics YOLO 🚀, AGPL-3.0 license
# Architecture: SPPF_LSKA + DyHead (Removed BiFPN)

# Parameters
nc: 16  # 你的类别数
scales: # model compound scaling constants, i.e. 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 9-改进点1: 保留 SPPF_LSKA

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10 (回归原始 Upsample，稳扎稳打)
  - [[-1, 6], 1, Concat, [1]]  # 11 (回归原始 Concat，剔除 Fusion)
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 (回归原始 Concat)
  - [-1, 3, C2f, [256]]  # 15 (P3_out)

  - [-1, 1, Conv, [256, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # 17 (回归原始 Concat)
  - [-1, 3, C2f, [512]]  # 18 (P4_out)

  - [-1, 1, Conv, [512, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # 20 (回归原始 Concat)
  - [-1, 3, C2f, [1024]]  # 21 (P5_out)

  # 改进点2: 使用 DyHead 替换 Detect
  - [[15, 18, 21], 1, DyHead, [nc]]  # 22-DyHead