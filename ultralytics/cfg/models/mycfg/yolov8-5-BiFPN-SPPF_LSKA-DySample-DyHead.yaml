# Ultralytics YOLO 🚀, AGPL-3.0 license
# Combined Architecture: SPPF_LSKA + BiFPN + DySample + DyHead

# Parameters
nc: 16  # 类别数
scales: # model compound scaling constants, i.e. 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 9-SPPF_LSKA

# Head (包含 Neck + Detect Head)
head:
  # === 原 Neck 部分开始 ===
  - [-1, 1, DySample, [2]]  # 10
  - [[-1, 6], 1, Fusion, [512]]  # 11-BiFPN Fusion P5->P4
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, DySample, [2]]  # 13
  - [[-1, 4], 1, Fusion, [256]]  # 14-BiFPN Fusion P4->P3
  - [-1, 3, C2f, [256]]  # 15 (P3_out)

  - [-1, 1, Conv, [256, 3, 2]]  # 16
  - [[-1, 12], 1, Fusion, [512]]  # 17-BiFPN Fusion P3->P4
  - [-1, 3, C2f, [512]]  # 18 (P4_out)

  - [-1, 1, Conv, [512, 3, 2]]  # 19
  - [[-1, 9], 1, Fusion, [1024]]  # 20-BiFPN Fusion P4->P5
  - [-1, 3, C2f, [1024]]  # 21 (P5_out)
  # === 原 Neck 部分结束 ===

  # 检测头
  - [[15, 18, 21], 1, DyHead, [nc]]  # 22-DyHead