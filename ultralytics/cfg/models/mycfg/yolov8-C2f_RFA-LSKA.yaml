# Ultralytics YOLO 🚀, AGPL-3.0 license
# Architecture: C2f_RFAConv (Backbone) + SPPF_LSKA

# Parameters
nc: 16
scales:
  n: [0.33, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  
  # === 改进点：在深层网络使用 C2f_RFAConv 增强细粒度特征 ===
  - [-1, 6, C2f_RFAConv, [512, True]] # 6
  
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  
  # === 改进点：在最深层也使用 C2f_RFAConv ===
  - [-1, 3, C2f_RFAConv, [1024, True]] # 8
  
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 9-SPPF_LSKA (保留涨点模块)

# Head (回归最原始的Head，先保证Backbone有效)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]