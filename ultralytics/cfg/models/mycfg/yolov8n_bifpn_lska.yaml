# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8n 原始配置 + Fusion (mode='bifpn') + SPPF_LSKA (加入 LSKA 模块)

# Parameters
nc: 80  # number of classes
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n 原始尺度参数 [depth, width, max_channels]

# Backbone (仅替换 SPPF 为 SPPF_LSKA，其余保持 YOLOv8 原生配置)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8
  # 修改点：加入 LSKA → 用 SPPF_LSKA 替换原生 SPPF，参数保持一致（1024, 5）
  - [-1, 1, SPPF_LSKA, [1024, 5]]  # 9 (整合 LSKA 的增强版 SPPF，替换原生 SPPF)

# Neck (保持之前的修改：所有 Concat 替换为 Fusion (mode='bifpn')，其余原生配置)
neck:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10 (上采样，原生配置)
  # 已修改：Concat → Fusion (mode='bifpn')，通道数 512 保持不变
  - [[-1, 6], 1, Fusion, [512, 'bifpn']]  # 11 (融合 P5 上采样结果与 P4)
  - [-1, 3, C2f, [512, False]]  # 12 (C2f 特征细化，原生配置)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13 (上采样，原生配置)
  # 已修改：Concat → Fusion (mode='bifpn')，通道数 256 保持不变
  - [[-1, 4], 1, Fusion, [256, 'bifpn']]  # 14 (融合 P4 上采样结果与 P3)
  - [-1, 3, C2f, [256, False]]  # 15 (C2f 特征细化，原生配置) → 最终 P3 输出

  - [-1, 1, Conv, [256, 3, 2]]  # 16 (下采样，原生配置)
  # 已修改：Concat → Fusion (mode='bifpn')，通道数 512 保持不变
  - [[-1, 12], 1, Fusion, [512, 'bifpn']]  # 17 (融合 P3 下采样结果与 P4)
  - [-1, 3, C2f, [512, False]]  # 18 (C2f 特征细化，原生配置) → 最终 P4 输出

  - [-1, 1, Conv, [512, 3, 2]]  # 19 (下采样，原生配置)
  # 已修改：Concat → Fusion (mode='bifpn')，通道数 1024 保持不变
  - [[-1, 9], 1, Fusion, [1024, 'bifpn']]  # 20 (融合 P4 下采样结果与 P5)
  - [-1, 3, C2f, [1024, False]]  # 21 (C2f 特征细化，原生配置) → 最终 P5 输出

# Head (完全保留 YOLOv8 原始 Detect 头，无任何修改)
head:
  - [[15, 18, 21], 1, Detect, [nc, [256, 512, 1024]]]  # 22 (原生 Detect 模块，无修改)