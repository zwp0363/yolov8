<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 目标检测 - 上传</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-left: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">YOLOv8 目标检测</h1>
        
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">上传</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/history">历史记录</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav" id="user-nav">
                        <!-- 登录前显示 -->
                        <li class="nav-item">
                            <a class="nav-link" href="/login">登录</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/register">注册</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <h3>上传图像</h3>
                <form id="upload-form">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="image-upload" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">模型选择</label>
                        <div class="mb-2">
                            <label for="model-select" class="form-label">预定义模型</label>
                            <select class="form-select" id="model-select">
                                <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\runs\\detect\\exp_LSKA-SENet-WIoU2\\weights\\best.pt">LSKA-SENet-WIoU2 模型</option>
                                <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolov8n.pt">YOLOv8n 模型</option>
                                <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolov5nu.pt">YOLOv5nu 模型</option>
                                <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolo11n.pt">YOLO11n 模型</option>
                            </select>
                        </div>
                        <div>
                            <label for="custom-model-upload" class="form-label">或上传自定义权重文件</label>
                            <input type="file" class="form-control" id="custom-model-upload" accept=".pt">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">检测</button>
                </form>
                <div id="uploaded-image" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查用户登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/user/info');
                const result = await response.json();
                
                if (!result.error) {
                    // 用户已登录
                    const userNav = document.getElementById('user-nav');
                    
                    // 生成头像HTML
                    let avatarHtml = '';
                    if (result.avatar) {
                        // 使用浏览器兼容的方式处理头像数据
                        try {
                            // 手动将十六进制字符串转换为字节
                            function hexToBytes(hex) {
                                const bytes = new Uint8Array(hex.length / 2);
                                for (let i = 0; i < hex.length; i += 2) {
                                    bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
                                }
                                return bytes;
                            }
                            
                            // 转换为base64
                            function bytesToBase64(bytes) {
                                let binary = '';
                                const len = bytes.byteLength;
                                for (let i = 0; i < len; i++) {
                                    binary += String.fromCharCode(bytes[i]);
                                }
                                return btoa(binary);
                            }
                            
                            const bytes = hexToBytes(result.avatar);
                            const base64 = bytesToBase64(bytes);
                            const avatarUrl = `data:image/jpeg;base64,${base64}`;
                            avatarHtml = `<img src="${avatarUrl}" alt="头像" class="avatar-small">`;
                        } catch (e) {
                            // 如果头像处理失败，使用默认头像
                            avatarHtml = `<img src="https://ui-avatars.com/api/?name=${result.username}&background=random" alt="默认头像" class="avatar-small">`;
                        }
                    } else {
                        // 使用默认头像占位符
                        avatarHtml = `<img src="https://ui-avatars.com/api/?name=${result.username}&background=random" alt="默认头像" class="avatar-small">`;
                    }
                    
                    userNav.innerHTML = `
                        <li class="nav-item">
                            <a class="nav-link" href="/profile">个人信息</a>
                        </li>
                        <li class="nav-item d-flex align-items-center">
                            <span class="nav-link">欢迎，${result.username}</span>
                            ${avatarHtml}
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-link nav-link" id="logout-btn">退出登录</button>
                        </li>
                    `;
                    
                    // 添加退出登录事件
                    document.getElementById('logout-btn').addEventListener('click', async function() {
                        try {
                            await fetch('/api/logout', {
                                method: 'POST'
                            });
                            window.location.reload();
                        } catch (error) {
                            console.error('退出登录失败:', error);
                        }
                    });
                }
            } catch (error) {
                // 用户未登录，保持默认状态
                console.error('检查登录状态失败:', error);
            }
        }
        
        // 上传表单处理
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const imageFile = document.getElementById('image-upload').files[0];
            const modelSelect = document.getElementById('model-select');
            const customModelUpload = document.getElementById('custom-model-upload');
            
            if (!imageFile) {
                alert('请选择一张图片');
                return;
            }
            
            formData.append('image', imageFile);
            
            // 检查是否上传了自定义模型
            if (customModelUpload.files.length > 0) {
                formData.append('custom_model', customModelUpload.files[0]);
            } else {
                // 使用预定义模型
                formData.append('model_path', modelSelect.value);
            }
            
            // 显示上传的图像
            const uploadedImage = document.getElementById('uploaded-image');
            uploadedImage.innerHTML = `<img src="${URL.createObjectURL(imageFile)}" alt="上传的图像">`;
            
            try {
                // 发送请求到后端
                const response = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                // 跳转到结果页面
                window.location.href = `/result/${result.id}`;
            } catch (error) {
                console.error('检测过程中发生错误:', error);
                alert('检测过程中发生错误，请查看控制台获取详细信息');
            }
        });
        
        // 页面加载时检查登录状态
        window.onload = checkLoginStatus;
    </script>
</body>
</html>
