<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道路车辆检测系统 - 上传</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-left: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">道路车辆检测系统</h1>
        
        <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">上传</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/history">历史记录</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav" id="user-nav">
                        <!-- 登录前显示 -->
                        <li class="nav-item">
                            <a class="nav-link" href="/login">登录</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/register">注册</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title mb-4">上传图像</h3>
                        <form id="upload-form">
                            <div class="mb-3">
                                <label for="image-upload" class="form-label">选择图像</label>
                                <input type="file" class="form-control" id="image-upload" accept="image/*" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">模型选择</label>
                                <div class="mb-2">
                                    <label for="model-select" class="form-label">预定义模型</label>
                                    <select class="form-select" id="model-select">
                                        <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\runs\\detect\\exp_LSKA-SENet-WIoU2\\weights\\best.pt">LSKA-SENet-WIoU2 模型</option>
                                        <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolov8n.pt">YOLOv8n 模型</option>
                                        <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolov5nu.pt">YOLOv5nu 模型</option>
                                        <option value="D:\\yolov8\\蓝云数据迁移\\yolov8\\yolov8\\yolov8\\yolo11n.pt">YOLO11n 模型</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="custom-model-upload" class="form-label">或上传自定义权重文件</label>
                                    <input type="file" class="form-control" id="custom-model-upload" accept=".pt">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">开始检测</button>
                        </form>
                        <div id="uploaded-image" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查用户登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/user/info');
                const result = await response.json();
                
                if (!result.error) {
                    // 用户已登录
                    const userNav = document.getElementById('user-nav');
                    userNav.innerHTML = `
                        <li class="nav-item">
                            <a class="nav-link" href="/profile">个人信息</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link">欢迎，${result.username} <img src="" alt="头像" class="avatar-small" id="user-avatar"></span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/api/logout">退出登录</a>
                        </li>
                    `;
                    
                    // 处理头像
                    const avatarImg = document.getElementById('user-avatar');
                    if (result.avatar) {
                        try {
                            // 十六进制转base64
                            function hexToBytes(hex) {
                                const bytes = new Uint8Array(hex.length / 2);
                                for (let i = 0; i < hex.length; i += 2) {
                                    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
                                }
                                return bytes;
                            }
                            
                            function bytesToBase64(bytes) {
                                const binString = Array.from(bytes, byte => String.fromCodePoint(byte)).join('');
                                return btoa(binString);
                            }
                            
                            const bytes = hexToBytes(result.avatar);
                            const base64 = bytesToBase64(bytes);
                            avatarImg.src = `data:image/jpeg;base64,${base64}`;
                        } catch (error) {
                            console.error('头像处理失败:', error);
                            // 头像处理失败时使用默认头像
                            avatarImg.src = `https://ui-avatars.com/api/?name=${result.username}&background=0D8ABC&color=fff`;
                        }
                    } else {
                        // 无头像时使用默认头像
                        avatarImg.src = `https://ui-avatars.com/api/?name=${result.username}&background=0D8ABC&color=fff`;
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }
        
        // 页面加载时检查登录状态
        window.onload = checkLoginStatus;
        
        // 上传表单处理
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const imageInput = document.getElementById('image-upload');
            const modelSelect = document.getElementById('model-select');
            const customModelInput = document.getElementById('custom-model-upload');
            
            if (!imageInput.files.length) {
                alert('请选择要上传的图像');
                return;
            }
            
            const formData = new FormData();
            formData.append('image', imageInput.files[0]);
            
            // 检查是否上传了自定义模型
            if (customModelInput.files.length) {
                formData.append('model', customModelInput.files[0]);
            } else {
                formData.append('model_path', modelSelect.value);
            }
            
            // 显示加载状态
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '检测中...';
            
            try {
                const response = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('检测失败');
                }
                
                const result = await response.json();
                
                if (result.error) {
                    alert(result.error);
                } else {
                    // 跳转到结果页面
                    window.location.href = `/result?image=${encodeURIComponent(result.image_path)}&detections=${encodeURIComponent(JSON.stringify(result.detections))}`;
                }
            } catch (error) {
                console.error('检测失败:', error);
                alert('检测失败，请重试');
            } finally {
                // 恢复按钮状态
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
        
        // 图片预览
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    document.getElementById('uploaded-image').innerHTML = '';
                    document.getElementById('uploaded-image').appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
